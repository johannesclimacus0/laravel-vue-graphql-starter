scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

type Query {
    me: User @auth
    myPreferences: UserPreferences! @guard
    mySecuritySettings: SecuritySettings! @guard
}

type Mutation {
    updateMyProfile(input: UpdateMyProfileInput!): User! @guard
    updateMyPreferences(input: UpdateMyPreferencesInput!): UserPreferences! @guard
    updateMyPassword(input: UpdateMyPasswordInput!): Boolean! @guard
    deleteMyAccount(input: DeleteMyAccountInput!): Boolean! @guard
}

type User {
    id: ID!
    name: String!
    email: String!
    emailVerifiedAt: DateTime @rename(attribute: "email_verified_at")
}

type UserPreferences {
    timezone: String!
}

input UpdateMyProfileInput {
    name: String! @trim
    email: String! @trim
}

type SecuritySettings {
    canManageTwoFactor: Boolean!
    twoFactorEnabled: Boolean!
    requiresConfirmation: Boolean!
    passwordRules: String!
}

input UpdateMyPreferencesInput {
    timezone: String! @trim
}

input UpdateMyPasswordInput {
    current_password: String!
    password: String!
    password_confirmation: String!
}

input DeleteMyAccountInput {
    password: String!
}
