scalar DateTime
    @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

type Query {
    me: User @auth
}

type Mutation {
    updateMyProfile(input: UpdateMyProfileInput!): User! @guard
}

type User {
    id: ID!
    name: String!
    email: String!
    emailVerifiedAt: DateTime @rename(attribute: "email_verified_at")
}

input UpdateMyProfileInput {
    name: String!
    email: String!
}
